events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    upstream frontend {
        server front:3000 max_fails=3 fail_timeout=30s;
    }
    
    upstream admins_api {
        server admins-api:8080 max_fails=3 fail_timeout=30s;
    }
    
    upstream checkout_api {
        server checkout-api:8081 max_fails=3 fail_timeout=30s;
    }
    
    upstream members_api {
        server members-api:8082 max_fails=3 fail_timeout=30s;
    }
    
    upstream users_api {
        server users-api:8083 max_fails=3 fail_timeout=30s;
    }
    
    upstream webhooks_api {
        server webhooks-api:8084 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=100r/s;

    # Frontend - kavoo.com
    server {
        listen 443 ssl http2;
        server_name kavoo.com www.kavoo.com;
    
        ssl_certificate /etc/ssl/certs/kavoo.com.crt;
        ssl_certificate_key /etc/ssl/certs/kavoo.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
        ssl_prefer_server_ciphers off;
        
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # Admin API - admin.kavoo.com
    server {
        listen 80;
        server_name admins.kavoo.com;
        
        location / {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://admins_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # Checkout API - checkout.kavoo.com
    server {
        listen 80;
        server_name checkout.kavoo.com;
        
        location / {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://checkout_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # Members API - members.kavoo.com
    server {
        listen 80;
        server_name members.kavoo.com;
        
        location / {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://members_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # Users API - users.kavoo.com
    server {
        listen 80;
        server_name users.kavoo.com;
        
        location / {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://users_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # Webhooks API - webhooks.kavoo.com
    server {
        listen 80;
        server_name webhooks.kavoo.com;
        
        location / {
            limit_req zone=webhooks burst=50 nodelay;
            
            proxy_pass http://webhooks_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # Health check endpoint
    server {
        listen 80 default_server;
        server_name _;
        
        location /health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
        
        location / {
            return 444;
        }
    }
}
