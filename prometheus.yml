global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'frontend'
    static_configs:
      - targets: ['front:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'admins-api'
    static_configs:
      - targets: ['admins-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'checkout-api'
    static_configs:
      - targets: ['checkout-api:8081']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'members-api'
    static_configs:
      - targets: ['members-api:8082']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'users-api'
    static_configs:
      - targets: ['users-api:8083']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'webhooks-api'
    static_configs:
      - targets: ['webhooks-api:8084']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: '/metrics'
    scrape_interval: 30s